<!-- A showcase of "TUFF AF" SVGs for the new MMM File Explorer -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MMM - Tuff Icon Set Preview</title>
    <style>
        :root {
            /* Minimalist Dark Mode Simulation */
            --bg-color: #121212;
            --surface-color: #1e1e1e;
            --text-color: #e0e0e0;
            --accent-color: #ffffff; /* pure white contrast */
            /* Minimalist Light Mode Simulation */
            --bg-light: #ffffff;
            --surface-light: #f5f5f5;
            --text-light: #18181b;
            --accent-light: #ea580c; /* sharp orange */
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'SF Pro Display', -apple-system, sans-serif;
            margin: 0;
            padding: 3rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            font-weight: 400;
            letter-spacing: -0.5px;
            margin-bottom: 3rem;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 2rem;
            width: 100%;
            max-width: 1000px;
        }
        .icon-card {
            background: var(--surface-color);
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 1px solid #333;
            transition: all 0.1s;
        }
        .icon-card:hover { border-color: #555; background: #252525; }
        .icon-card svg {
            width: 32px;
            height: 32px;
            stroke: var(--text-color);
            fill: none;
            stroke-width: 1.5;
            stroke-linecap: round;
            stroke-linejoin: round;
            margin-bottom: 1rem;
        }
        .icon-name {
            font-size: 0.75rem;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <h1>TUFF AF. Minimalist Icons.</h1>
    
    <div class="grid">
        
        <!-- File System -->
        <div class="icon-card">
            <svg viewBox="0 0 24 24">
                <path d="M3 5h6l2 2h10v12H3z" />
            </svg>
            <div class="icon-name">Folder</div>
        </div>

        <div class="icon-card">
            <svg viewBox="0 0 24 24">
                <!-- Open folder style -->
                <path d="M3 5h6l2 2h10v12H3z" opacity="0.4"/>
                <path d="M3 9l2.5-4h13l-2.5 4z" />
            </svg>
            <div class="icon-name">Folder Open</div>
        </div>
        
        <div class="icon-card">
            <svg viewBox="0 0 24 24">
                <path d="M6 2h8l6 6v14H6z M14 2v6h6" />
            </svg>
            <div class="icon-name">File Blank</div>
        </div>

        <div class="icon-card">
            <svg viewBox="0 0 24 24">
                <path d="M6 2h8l6 6v14H6z M14 2v6h6" />
                <path d="M9 13h6 M9 17h4" />
            </svg>
            <div class="icon-name">File Text</div>
        </div>

        <div class="icon-card">
            <svg viewBox="0 0 24 24">
                <path d="M6 2h8l6 6v14H6z M14 2v6h6" />
                <circle cx="12" cy="14" r="3" />
                <path d="M14.5 16.5 L17 19" />
            </svg>
            <div class="icon-name">File Search</div>
        </div>

        <div class="icon-card">
            <svg viewBox="0 0 24 24">
                <rect x="3" y="3" width="18" height="18" />
                <path d="M3 15 l5-5 l5 5 l6-6 v14" />
                <circle cx="8" cy="8" r="1.5" />
            </svg>
            <div class="icon-name">Image</div>
        </div>

        <div class="icon-card">
            <svg viewBox="0 0 24 24">
                <path d="M3 12h18 M12 3v18" />
            </svg>
            <div class="icon-name">Plus / Add</div>
        </div>

        <div class="icon-card">
            <svg viewBox="0 0 24 24">
                <path d="M4 6h16 M4 12h16 M4 18h16" />
            </svg>
            <div class="icon-name">Menu</div>
        </div>

        <!-- Navigation -->
        <div class="icon-card">
            <svg viewBox="0 0 24 24">
                <path d="M9 18l6-6-6-6" />
            </svg>
            <div class="icon-name">Chevron Right</div>
        </div>

        <div class="icon-card">
            <svg viewBox="0 0 24 24">
                <path d="M15 18l-6-6 6-6" />
            </svg>
            <div class="icon-name">Chevron Left</div>
        </div>

        <div class="icon-card">
            <svg viewBox="0 0 24 24">
                <path d="M3 9l9-7 9 7v11a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z M9 21v-6h6v6" />
            </svg>
            <div class="icon-name">Home</div>
        </div>

        <div class="icon-card">
            <svg viewBox="0 0 24 24">
                <!-- Settings Gear (sharp minimalist) -->
                <circle cx="12" cy="12" r="3" />
                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z" />
            </svg>
            <div class="icon-name">Settings</div>
        </div>

        <div class="icon-card">
            <svg viewBox="0 0 24 24">
                <circle cx="11" cy="11" r="8" />
                <path d="M21 21l-4.35-4.35" />
            </svg>
            <div class="icon-name">Search</div>
        </div>

        <div class="icon-card">
            <svg viewBox="0 0 24 24">
                <path d="M3 6h7l2 2h9v10H3z" />
                <path d="M16 12v4 M14 14h4" />
            </svg>
            <div class="icon-name">Add Folder</div>
        </div>

        <!-- Sidebar toggler -->
        <div class="icon-card">
            <svg viewBox="0 0 24 24">
                <rect x="3" y="3" width="18" height="18" />
                <path d="M9 3v18" />
            </svg>
            <div class="icon-name">Sidebar</div>
        </div>
        
    </div>
</body>
</html>
